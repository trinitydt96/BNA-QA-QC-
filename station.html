<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BNA Production Station</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--s1:#0f1520;--s2:#161e2e;--s3:#1e2a3e;--bd2:#2a3a52;--tx:#d4e0f0;--mu:#5a7090;--dm:#3a4f6a;--gn:#00d084;--rd:#ff4d6a;--am:#f5a623;--bl:#3b82f6;--mono:"Share Tech Mono",monospace;--head:"Rajdhani",sans-serif;--body:"Inter",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--body);min-height:100vh;font-size:14px}
.top{background:var(--s1);border-bottom:1px solid var(--bd2);padding:10px 14px;position:sticky;top:0;z-index:100}
.top-std{font-family:var(--mono);font-size:9px;color:var(--bl);letter-spacing:.15em;margin-bottom:3px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-family:var(--head);font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.st-badge{font-family:var(--head);font-size:14px;font-weight:700;padding:5px 14px;border-radius:8px;letter-spacing:.08em;text-transform:uppercase}
.wrap{padding:16px 14px}
.search-wrap{position:relative;margin-bottom:8px}
.si{background:var(--s2);border:2px solid var(--bd2);border-radius:10px;padding:13px 14px;font-size:16px;font-family:var(--body);color:var(--tx);width:100%;outline:none}
.si::placeholder{color:var(--dm)}
.si:focus{border-color:var(--bl)}
.dl{position:absolute;top:100%;left:0;right:0;background:#1a2436;border:1px solid #3a5070;border-radius:10px;max-height:260px;overflow-y:auto;z-index:500;margin-top:3px;box-shadow:0 8px 24px rgba(0,0,0,.6);display:none}
.dl.open{display:block}
.di{padding:13px 14px;cursor:pointer;border-bottom:1px solid #1e2a3e}
.di:last-child{border-bottom:none}
.di:active{background:#1e2a3e}
.di-id{font-family:var(--head);font-weight:700;font-size:17px;color:#e8f0fc;letter-spacing:.03em}
.di-info{font-family:var(--mono);font-size:10px;color:#5a7090;margin-top:3px}
.frame-card{border-radius:14px;padding:20px;margin-bottom:12px;text-align:center;display:none}
.frame-card.show{display:block}
.fc-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;opacity:.7}
.fc-id{font-family:var(--head);font-size:32px;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.fc-sub{font-family:var(--mono);font-size:11px;opacity:.6;margin-bottom:16px;line-height:1.6}
.done-btn{width:100%;padding:20px;border:none;border-radius:12px;font-family:var(--head);font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:transform .1s}
.done-btn:active{transform:scale(.97)}
.done-btn:disabled{opacity:.4;cursor:default}
.undo-btn{width:100%;padding:10px;background:none;border:1px solid var(--bd2);border-radius:8px;color:var(--mu);font-family:var(--mono);font-size:10px;cursor:pointer;margin-top:8px;letter-spacing:.05em}
.status-msg{font-family:var(--mono);font-size:12px;text-align:center;padding:8px;min-height:28px;letter-spacing:.05em}
.station-pick{margin-bottom:16px}
.sp-title{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:8px}
.sp-btns{display:flex;gap:8px}
.sp-btn{flex:1;padding:14px 8px;border-radius:10px;border:2px solid var(--bd2);background:var(--s2);text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.sp-btn.on{border-width:2px}
.sp-btn .sp-icon{font-family:var(--head);font-size:22px;font-weight:700;margin-bottom:3px}
.sp-btn .sp-name{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.confirm-screen{display:none;text-align:center;padding:30px 14px}
.confirm-screen.show{display:block}
.confirm-icon{font-size:72px;margin-bottom:12px}
.confirm-title{font-family:var(--head);font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.confirm-sub{font-family:var(--mono);font-size:11px;color:var(--mu);line-height:1.8}
.recent-list{margin-top:16px}
.recent-title{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--bd2)}
.recent-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.recent-item:last-child{border-bottom:none}
.ri-id{font-family:var(--head);font-size:14px;font-weight:600;letter-spacing:.03em}
.ri-info{font-family:var(--mono);font-size:9px;color:var(--mu);margin-top:1px}
.ri-st{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:10px;font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd2);color:var(--tx);padding:8px 18px;border-radius:20px;font-family:var(--mono);font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>

</div>

// Build station picker
function buildStationPicker(){
  var el = document.getElementById("sp-btns");
  el.innerHTML = "";
  STATIONS.forEach(function(st){
    var btn = document.createElement("div");
    btn.className = "sp-btn";
    btn.id = "sp-" + st.id;
    btn.innerHTML = '<div class="sp-icon" style="color:'+st.color+'">'+st.icon+'</div>'
      + '<div class="sp-name" style="color:'+st.color+'">'+st.name+'</div>';
    btn.addEventListener("click", function(){selectStation(st);});
    el.appendChild(btn);
  });
}

function selectStation(st){
  selStation = st;
  // Update badge
  var badge = document.getElementById("st-badge");
  badge.textContent = st.name;
  badge.style.cssText = "font-family:var(--head);font-size:14px;font-weight:700;padding:5px 14px;border-radius:8px;letter-spacing:.08em;text-transform:uppercase;background:"+st.bg+";border:2px solid "+st.bd+";color:"+st.color;
  // Highlight selected station button
  STATIONS.forEach(function(s){
    var b = document.getElementById("sp-"+s.id);
    if(b){
      if(s.id===st.id){
        b.style.cssText="flex:1;padding:14px 8px;border-radius:10px;border:2px solid "+st.bd+";background:"+st.bg+";text-align:center;cursor:pointer;user-select:none";
      }else{
        b.style.cssText="flex:1;padding:14px 8px;border-radius:10px;border:2px solid var(--bd2);background:var(--s2);text-align:center;cursor:pointer;user-select:none;opacity:0.5";
      }
    }
  });
  // Show search
  document.getElementById("search-section").style.display = "block";
  document.getElementById("si").focus();
  // Update done button
  var done = document.getElementById("done-btn");
  done.style.cssText = "width:100%;padding:20px;border:none;border-radius:12px;font-family:var(--head);font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:"+st.color+";color:#fff";

}

// Search
document.getElementById("si").addEventListener("input", function(){doSearch(this.value);});
document.getElementById("si").addEventListener("blur", function(){
  setTimeout(function(){document.getElementById("dl").className="dl";}, 200);
});
document.addEventListener("click", function(e){
  if(!e.target.closest(".search-wrap"))document.getElementById("dl").className="dl";
});

function doSearch(val){
  var q = val.toLowerCase().trim();
  var dl = document.getElementById("dl");
  if(!q){dl.className="dl";return;}
  var res = [];
  for(var i=0;i<FRAMES.length&&res.length<12;i++){
    if(FRAMES[i].id.toLowerCase().indexOf(q)>=0||FRAMES[i].sys.toLowerCase().indexOf(q)>=0){
      res.push(FRAMES[i]);
    }
  }
  if(!res.length){dl.className="dl";return;}
  dl.innerHTML="";
  res.forEach(function(f){
    var d = document.createElement("div");
    d.className = "di";
    d.innerHTML = '<div class="di-id">'+f.id+'</div>'
      + '<div class="di-info">'+f.sys+(f.lv?' / '+f.lv:'')
      +' / W:'+f.mdw+'" H:'+f.mdh+'" / '+f.jamb+'</div>';
    d.addEventListener("mousedown", function(e){e.preventDefault();});
    d.addEventListener("click", (function(frame){return function(){selectFrame(frame);};})(f));
    dl.appendChild(d);
  });
  dl.className = "dl open";
}

function selectFrame(f){
  selFrame = f;
  document.getElementById("si").value = f.id;
  document.getElementById("dl").className = "dl";
  // Show frame card
  var card = document.getElementById("frame-card");
  var st = selStation;

  document.getElementById("fc-id").style.color = st.color;

  document.getElementById("status-msg").textContent = "";
  document.getElementById("done-btn").disabled = false;
  card.scrollIntoView({behavior:"smooth",block:"center"});

  // Fetch completed stations for this frame and check if current station already done
  fetch(WH+"?action=stationstatus&frameId="+encodeURIComponent(f.id),{method:"GET",mode:"cors"})
    .then(function(r){return r.json();})
    .then(function(data){
      var done = data.done || [];
      var stationOrder = ["ASSEMBLY","GLAZING","FACE CAP"];
      var msg = document.getElementById("status-msg");

      var curName = selStation ? selStation.name.toUpperCase() : "";

      if (alreadyDone) {
        msg.style.color = "var(--am)";
        msg.textContent = "⚠ " + selStation.name + " already recorded for this frame";
        document.getElementById("done-btn").disabled = true;

      // Show which stations are complete as chips below frame info
      var sub = document.getElementById("fc-sub");
      var stChips = done.map(function(d){
        return '<span style="display:inline-block;margin:3px 4px;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;background:#E8F5E9;color:#1A5E20;border:1px solid #A5D6A7;">✓ '+d+'</span>';
      }).join("");
      if (stChips) {
        sub.innerHTML = f.sys + (f.lv?' / '+f.lv:'') + ' / W:'+f.mdw+'" H:'+f.mdh+'"'
          + '<br><span style="font-size:11px;">Completed: </span>' + stChips;
      }
    })
    .catch(function(e){ console.warn("Station status fetch error:", e); });
}

function markDone(){
  if(!selFrame||!selStation)return;
  var btn = document.getElementById("done-btn");
  btn.disabled = true;
  var msg = document.getElementById("status-msg");
  msg.style.color = "var(--am)";
  msg.textContent = "Saving...";

  var rec = {
    action: "station",
    frameId: selFrame.id,
    station: selStation.id,
    stationName: selStation.name,
    sys: selFrame.sys,
    level: selFrame.lv || "",
    ts: new Date().toISOString()
  };

  // Save locally
  recentScans.unshift({
    frameId: selFrame.id,
    station: selStation.name,
    color: selStation.color,
    time: new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})
  });
  try{
    var saved = JSON.parse(localStorage.getItem("bna-station")||"[]");
    saved.unshift(rec);
    localStorage.setItem("bna-station", JSON.stringify(saved.slice(0,200)));
  }catch(e){}

  // Send to Google Sheets via fetch
  fetch(WH + "?" + new URLSearchParams(rec).toString(), {method:"GET", mode:"no-cors"})
    .catch(function(e){ console.warn("Station save error:", e); });

  // Determine next station
  var stationOrder = ["assembly","glazing","facecap"];
  var curIdx = stationOrder.indexOf(selStation.id);
  var nextStation = curIdx >= 0 && curIdx < stationOrder.length - 1
    ? STATIONS[curIdx + 1] : null;

  // Show confirmation then advance to next station
  setTimeout(function(){
    msg.textContent = "";
    document.getElementById("frame-card").className = "frame-card";
    showConfirm(selFrame.id, selStation);
    renderRecent();
    setTimeout(function(){
      hideConfirm();
      if (nextStation) {
        // Auto-select next station and reload same frame
        selectStation(nextStation);
        var frameId = selFrame ? selFrame.id : null;
        document.getElementById("si").value = "";
        if (frameId) {
          // Re-scan same frame into next station
          var f = FM[frameId];
          if (f) {
            selectFrame(f);
          }
        }
      } else {
        // All stations done — reset fully
        document.getElementById("si").value = "";
        document.getElementById("si").focus();
        selFrame = null;
      }
    }, 2000);
  }, 800);
}

function showConfirm(frameId, st){
  var scr = document.getElementById("confirm-screen");
  scr.className = "confirm-screen show";
  scr.style.cssText = "display:block;text-align:center;padding:30px 14px";
  document.getElementById("confirm-title").textContent = st.name + " DONE";
  document.getElementById("confirm-title").style.color = st.color;
  document.getElementById("confirm-sub").innerHTML = frameId + "<br>Saved to Google Sheets";
}

function hideConfirm(){
  document.getElementById("confirm-screen").className = "confirm-screen";
}

function resetFrame(){
  selFrame = null;
  document.getElementById("frame-card").className = "frame-card";
  document.getElementById("si").value = "";
  document.getElementById("si").focus();
}

function renderRecent(){
  var el = document.getElementById("recent-list");
  var items = document.getElementById("recent-items");
  if(!recentScans.length){el.style.display="none";return;}
  el.style.display = "block";
  items.innerHTML = "";
  recentScans.slice(0,8).forEach(function(r){
    var row = document.createElement("div");
    row.className = "recent-item";
    var left = document.createElement("div");
    var id = document.createElement("div");id.className="ri-id";id.textContent=r.frameId;
    var info = document.createElement("div");info.className="ri-info";info.textContent=r.time;
    left.appendChild(id);left.appendChild(info);
    var badge = document.createElement("span");
    badge.className = "ri-st";
    badge.style.cssText = "font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:10px;font-weight:600;background:"+r.color+"22;color:"+r.color;
    badge.textContent = r.station;
    row.appendChild(left);row.appendChild(badge);
    items.appendChild(row);
  });
}

function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");},2000);
}

// Init
buildStationPicker();
if(urlSt){
  var found = STATIONS.find(function(s){return s.id===urlSt;});
  if(found)selectStation(found);
}

</script>
</body>
